name: Build BUILDCOST V3 APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      # ==========================================
      # 1. CHECKOUT PROJECT
      # ==========================================
      - name: Checkout
        uses: actions/checkout@v4

      # ==========================================
      # 2. SETUP FLUTTER
      # ==========================================
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # ==========================================
      # 3. CREATE ANDROID PROJECT
      # ==========================================
      - name: Create Android project files
        run: flutter create --platforms=android .

      # ==========================================
      # 4. REMOVE DEFAULT FLUTTER TEST
      # ==========================================
      - name: Remove default Flutter test
        run: rm -rf test

      # ==========================================
      # 5. INSTALL DEPENDENCIES
      # ==========================================
      - name: Install dependencies
        run: flutter pub get

      # ==========================================
      # 6. ANALYZE FLUTTER CODE
      # ==========================================
      - name: Analyze
        run: flutter analyze --no-fatal-infos

      # ==========================================
      # 7. BUILD RELEASE APK
      # ==========================================
      - name: Build APK
        run: flutter build apk --release

      # ==========================================
      # 8. UPLOAD APK
      # ==========================================
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: buildcost-v3-apk
          path: build/app/outputs/flutter-apk/app-release.apk
