name: Build BUILDCOST Full APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Prepare icon fallback
        run: |
          mkdir -p assets/icon
          if [ ! -f assets/icon/buildcost_icon.png ]; then
            python3 - <<'PY'
            import struct,zlib
            # 1x1 navy PNG fallback; replace with approved icon asset for branded launcher.
            def chunk(t,d): return struct.pack('!I',len(d))+t+d+struct.pack('!I',zlib.crc32(t+d)&0xffffffff)
            raw=b'\x00\x10\x2a\x56\xff'
            png=b'\x89PNG\r\n\x1a\n'+chunk(b'IHDR',struct.pack('!2I5B',1,1,8,6,0,0,0))+chunk(b'IDAT',zlib.compress(raw))+chunk(b'IEND',b'')
            open('assets/icon/buildcost_icon.png','wb').write(png)
            PY
          fi
      - name: Create Android project
        run: flutter create --platforms=android .
      - name: Install dependencies
        run: flutter pub get
      - name: Generate app icon
        run: dart run flutter_launcher_icons
      - name: Remove default test
        run: rm -rf test
      - name: Analyze
        run: flutter analyze --no-pub
      - name: Build APK
        run: flutter build apk --release
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: buildcost-v3-apk
          path: build/app/outputs/flutter-apk/app-release.apk
